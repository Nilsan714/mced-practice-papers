<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCED Practice Papers</title>
<style>
:root{--bg:#f6f7fb;--fg:#1b1e28;--card:#fff;--ac:#2b59ff;--mu:#6b7080;--ok:#12805c;--bad:#c0392b;--bd:#dfe2ec}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--fg:#e8eaf2;--card:#1c1f2a;--mu:#9aa0b4;--bd:#2c3040;--ok:#4cd9a0;--bad:#ff7b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Nirmala UI",sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 8px}h2{font-size:17px;margin:0 0 6px}
input[type=text]{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:12px 18px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;z-index:2}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card)}
.opt.s{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.sec{color:var(--mu);font-size:13px}.nav{display:flex;gap:8px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.grid button{padding:8px 0;font-size:14px}
.grid .a{background:var(--ac);color:#fff}.grid .c{outline:2px solid var(--fg)}
.bar{height:6px;background:var(--bd);border-radius:3px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.big{font-size:40px;font-weight:700}.pl{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;margin:6px 0}
.tag{font-size:12px;color:var(--mu)}.pct{height:8px;background:var(--bd);border-radius:4px;margin:2px 0 8px}.pct i{display:block;height:100%;border-radius:4px}
</style></head><body><div class="w" id="app"></div>
<script>
const $=id=>document.getElementById(id),app=$('app');
let P,S={name:'',paper:null,ans:{},i:0,start:0,done:false,result:null},tm;

let STATIC=null,SD=null;
async function sdata(){if(!SD){const g=async n=>(await fetch('data/'+n)).json();SD={papers:await g('papers.json'),ans:await g('answers.json'),exp:await g('explain.json')}}return SD}
async function apiPapers(){
  if(STATIC!==true){try{const r=await fetch('api/papers');if(r.ok&&(r.headers.get('content-type')||'').includes('json')){STATIC=false;return r.json()}}catch(e){}STATIC=true}
  const d=await sdata();return d.papers.map(p=>({id:p.id,title:p.title,n:p.questions.length,duration:p.duration}))}
async function apiPaper(id){if(STATIC)return (await sdata()).papers.find(p=>String(p.id)===String(id));return (await fetch('api/paper/'+id)).json()}
async function apiSubmit(body){
  if(!STATIC){const r=await fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json()}
  const d=await sdata(),p=d.papers.find(x=>String(x.id)===String(body.paper)),A=d.ans[body.paper],E=d.exp[body.paper];
  const subs=p.subtopics.map(()=>[0,0]);let total=0;
  p.questions.forEach(q=>{subs[q.sub][1]++;if(body.answers[q.id]===A[q.id]){subs[q.sub][0]++;total++}});
  return {total,out_of:p.questions.length,subs,review:p.questions.map(q=>Object.assign({id:q.id,yours:body.answers[q.id]||null,correct:A[q.id]},E[q.id]))}}
const KEY=()=>'mced_p'+S.paper;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const save=()=>{try{localStorage[KEY()]=JSON.stringify(S);localStorage.mced_name=S.name}catch(e){}};
const getName=()=>{try{return localStorage.mced_name||''}catch(e){return ''}};
async function home(){
  clearInterval(tm);
  const list=await apiPapers();
  app.innerHTML='<div class="card"><h1>MCED District Account Assistant</h1><p class="sec">Practice Papers · Hindi–Marathi mix · हा practice आहे, official paper नाही · 1 mark each · no negative marking</p>'
   +'<input type="text" id="nm" placeholder="Candidate Name" autocomplete="name" value="'+esc(getName())+'"></div>'
   +list.map(p=>{let st='';try{const x=JSON.parse(localStorage['mced_p'+p.id]||'null');if(x&&x.done)st=' ✓ '+x.result.total+'/'+x.result.out_of;else if(x&&x.start)st=' (सुरू)'}catch(e){}
     return '<button class="pl card" data-id="'+p.id+'"><span><b>'+esc(p.title)+'</b><br><span class="tag">'+p.n+' प्रश्न · '+p.duration+' मिनिटे'+st+'</span></span><span>›</span></button>'}).join('');
  document.querySelectorAll('.pl').forEach(b=>b.onclick=()=>{const n=$('nm').value.trim();if(!n)return $('nm').focus();open_(b.dataset.id,n)});
}
async function open_(id,name){
  P=await apiPaper(id);
  S={name:name,paper:id,ans:{},i:0,start:0,done:false,result:null};
  try{const x=JSON.parse(localStorage['mced_p'+id]||'null');if(x&&x.start&&!x.done){S=x;S.name=name}else if(x&&x.done){S=x;S.name=name;return result(S.result)}}catch(e){}
  if(S.start)return quiz();
  app.innerHTML='<div class="card"><h1>'+esc(P.title)+'</h1><p>'+P.questions.length+' प्रश्न · '+P.duration+' मिनिटे · 1 mark each · no negative marking</p><p class="sec">प्रत्येक प्रश्नासाठी एकच best answer निवडा. निकाल व स्पष्टीकरण submit नंतर दिसेल.</p><button class="p" id="go">Start Test</button> <button id="bk">← Back</button></div>';
  $('go').onclick=()=>{S.start=Date.now();save();quiz()};$('bk').onclick=home;
}
const DUR=()=>P.duration*60;
const left=()=>Math.max(0,DUR()-Math.floor((Date.now()-S.start)/1000));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function quiz(){clearInterval(tm);tm=setInterval(()=>{const t=$('t');if(t)t.textContent=fmt(left());if(left()<=0){clearInterval(tm);submit(true)}},1000);draw()}
function draw(){
  const N=P.questions.length,q=P.questions[S.i],n=Object.keys(S.ans).length;
  app.innerHTML='<div class="top"><b>Q '+(S.i+1)+'/'+N+'</b><span class="sec">Answered '+n+'/'+N+'</span><b id="t">'+fmt(left())+'</b></div>'
  +'<div class="bar"><i style="width:'+((S.i+1)/N*100)+'%"></i></div><br>'
  +'<div class="card"><div class="sec">'+esc(P.subtopics[q.sub])+'</div><p><b>'+esc(q.q)+'</b></p>'
  +q.opts.map((o,k)=>{const Lt='ABCD'[k];return '<button class="opt '+(S.ans[q.id]==Lt?'s':'')+'" data-l="'+Lt+'"><b>'+Lt+'.</b> '+esc(o)+'</button>'}).join('')+'</div>'
  +'<div class="nav"><button id="pv" '+(S.i?'':'disabled')+'>← Prev</button><button id="ov">Overview</button><button id="nx" class="p">'+(S.i<N-1?'Next →':'Finish')+'</button></div>';
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[q.id]=b.dataset.l;save();draw()});
  $('pv').onclick=()=>{S.i--;save();draw()};
  $('nx').onclick=()=>{if(S.i<N-1){S.i++;save();draw()}else overview()};
  $('ov').onclick=overview;
}
function overview(){
  const N=P.questions.length,n=Object.keys(S.ans).length;
  app.innerHTML='<div class="top"><b>Overview</b><b id="t">'+fmt(left())+'</b></div><div class="card"><div class="grid">'
  +P.questions.map((q,k)=>'<button class="'+(S.ans[q.id]?'a':'')+' '+(k==S.i?'c':'')+'" data-k="'+k+'">'+q.id+'</button>').join('')
  +'</div><p class="sec">Answered '+n+'/'+N+' · '+(N-n)+' unanswered</p></div><div class="nav"><button id="bk">← Back</button><button class="p" id="sb">Submit Test</button></div>';
  document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.k;save();draw()});
  $('bk').onclick=draw;$('sb').onclick=()=>{if(confirm('Submit? '+(N-n)+' unanswered.'))submit()};
}
async function submit(auto){
  clearInterval(tm);app.innerHTML='<div class="card">Submitting…</div>';
  try{
    const j=await apiSubmit({paper:S.paper,name:S.name,answers:S.ans,elapsed:Math.min(DUR(),Math.floor((Date.now()-S.start)/1000))});if(j.error)throw Error(j.error);
    S.done=true;S.result=j;save();result(j,auto);
  }catch(e){
    app.innerHTML='<div class="card">Submit failed ('+esc(e.message)+'). Answers saved on phone.<br><br><button class="p" id="rt">Retry</button></div>';
    $('rt').onclick=()=>submit(auto);
  }
}
function result(j,auto){
  const rv=j.review;
  const subs=j.subs.map((s,k)=>{const pc=s[1]?Math.round(s[0]/s[1]*100):0,col=pc<50?'var(--bad)':pc<75?'#d99a00':'var(--ok)';
    return '<div>'+esc(P.subtopics[k])+': <b>'+s[0]+'/'+s[1]+'</b> ('+pc+'%)'+(s[1]>=3&&pc<50?' — <span style="color:var(--bad)">पुन्हा शिका: '+esc(P.lessons[k])+'</span>':'')+'</div><div class="pct"><i style="width:'+pc+'%;background:'+col+'"></i></div>'}).join('');
  app.innerHTML='<div class="card"><h1>'+esc(S.name)+'</h1><div class="sec">'+esc(P.title)+'</div>'+(auto?'<p class="sec">Time up — auto-submitted.</p>':'')+'<div class="big">'+j.total+'/'+j.out_of+'</div>'
  +'<p class="sec">Topic-wise (guide, official नाही): &lt;50% re-teach · 50–74% practice · ≥75% relatively secure. फक्त total वरून weak/strong ठरवू नका.</p>'+subs+'</div>'
  +'<div class="card"><b>Review</b>'+P.questions.map((q,k)=>{
    const r=rv[k],ok=r.yours==r.correct;
    return '<div style="margin-top:14px"><div class="sec">'+q.id+'. '+esc(q.q)+'</div><div style="color:var(--'+(ok?'ok':'bad')+')">'+(ok?'✓':'✗')+' Your: '+(r.yours?r.yours+'. '+esc(q.opts['ABCD'.indexOf(r.yours)]):'—')+'</div>'
    +(ok?'':'<div style="color:var(--ok)">Correct: '+r.correct+'. '+esc(q.opts['ABCD'.indexOf(r.correct)])+'</div>')
    +(r.exp?'<div class="sec">'+esc(r.exp)+'</div>':'')+(r.concept?'<div class="sec"><i>'+esc(r.concept)+'</i></div>':'')+'</div>'}).join('')+'</div>'
  +'<div class="nav"><button id="hm">← सर्व Papers</button><button id="rs">हा paper पुन्हा सोडवा</button></div>';
  $('hm').onclick=home;
  $('rs').onclick=()=>{try{localStorage.removeItem(KEY())}catch(e){}open_(S.paper,S.name)};
}
home();
</script></body></html>
